<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ssot-framework</title>

<link rel="stylesheet" href="/styles.css">
</head>
<body>

<aside>
	<h1>ssot-framework</h1>
	<h2>Entidades</h2>
	<nav id="entities"></nav>
</aside>

<main>
	<header>
		<h2 id="title"></h2>
		<p id="status" data-state="busy">Cargando…</p>
	</header>

	<!-- Filter bar -->
	<div id="toolbar"></div>

	<div class="sheet">
		<table id="grid" hidden>
			<thead><tr id="head"></tr></thead>
			<tbody id="rows"></tbody>
		</table>
		<p id="empty" hidden>La entidad no tiene registros.</p>
	</div>
</main>

<!-- One row view -->
<section id="peek" hidden aria-labelledby="peek-title">
	<header>
		<div>
			<small id="peek-entity"></small>
			<h2 id="peek-title"></h2>
		</div>
		<button id="peek-close" type="button" title="Cerrar" aria-label="Cerrar"></button>
	</header>
	<dl id="peek-fields"></dl>
</section>

<script type="module" src="/main.js"></script>
</body>
</html>
