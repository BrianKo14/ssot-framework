<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ssot-framework</title>

<link rel="stylesheet" href="/styles.css">
</head>
<body>

<aside>
	<h1>ssot-framework</h1>
	<h2>Entidades</h2>
	<nav id="entities"></nav>

	<!-- Current user info -->
	<div id="account" hidden>
		<span id="account-who">
			<span id="account-username"></span>
			<span id="account-role"></span>
		</span>
		<button id="logout" type="button">Salir</button>
	</div>
</aside>

<main>
	<header>
		<h2 id="title"></h2>
		<!-- The right end of the header: what the screen says, then what can be taken from it -->
		<div id="header-end">
			<p id="status" data-state="busy">Cargando…</p>
		</div>
	</header>

	<!-- Filter bar -->
	<div id="toolbar"></div>

	<div class="sheet">
		<table id="grid" hidden>
			<thead><tr id="head"></tr></thead>
			<tbody id="rows"></tbody>
		</table>
		<p id="empty" hidden>La entidad no tiene registros.</p>
	</div>
</main>

<!-- One row view -->
<section id="peek" hidden aria-labelledby="peek-title">
	<header>
		<div>
			<small id="peek-entity"></small>
			<h2 id="peek-title"></h2>
		</div>
		<button id="peek-close" type="button" title="Cerrar" aria-label="Cerrar"></button>
	</header>
	<form id="peek-form">
		<dl id="peek-fields"></dl>
		<footer id="peek-actions">
			<button id="peek-delete" type="button">Eliminar</button>
			<button id="peek-cancel" type="button">Cancelar</button>
			<button id="peek-save" type="submit">Guardar</button>
		</footer>
	</form>

	<!-- The record's subtables: one tab per entity that is a detail of it -->
	<section id="peek-details" hidden aria-labelledby="peek-details-title">
		<h3 id="peek-details-title">Detalles</h3>
		<div id="peek-tabbar">
			<div id="peek-tabs" role="tablist" aria-labelledby="peek-details-title"></div>
		</div>
		<div id="peek-detail" class="sheet" role="tabpanel">
			<table id="peek-detail-grid" hidden>
				<thead><tr id="peek-detail-head"></tr></thead>
				<tbody id="peek-detail-rows"></tbody>
			</table>
			<p id="peek-detail-empty" hidden>Sin registros.</p>
		</div>
	</section>

	<!-- What has been written over this record, and by whom (SCOPE 8c) -->
	<section id="peek-changes" hidden aria-labelledby="peek-changes-title">
		<h3 id="peek-changes-title">Cambios</h3>
		<ol id="peek-changes-list"></ol>
		<p id="peek-changes-empty" hidden>Sin cambios.</p>
	</section>
</section>

<!-- Fields borrowed from the tables this one points at -->
<dialog id="ancestry" aria-labelledby="ancestry-title">
	<header>
		<h2 id="ancestry-title">Campos de tablas ancestro</h2>
		<button id="ancestry-close" type="button" title="Cerrar" aria-label="Cerrar"></button>
	</header>
	<div id="ancestry-groups"></div>
	<p id="ancestry-none" hidden>Esta entidad no apunta a ninguna otra.</p>
</dialog>

<!-- Login screen -->
<section id="login" data-state="checking" aria-labelledby="login-title">
	<form id="login-form">
		<h1 id="login-title">ssot-framework</h1>
		<p id="login-intro">Iniciá sesión para ver las entidades.</p>

		<label for="login-username">Usuario</label>
		<input id="login-username" name="username" autocomplete="username" required>

		<label for="login-password">Contraseña</label>
		<input id="login-password" name="password" type="password" autocomplete="current-password" required>

		<button id="login-submit" type="submit">Entrar</button>
		<p id="login-error" role="alert" hidden></p>
	</form>
</section>

<script type="module" src="/main.js"></script>
</body>
</html>
